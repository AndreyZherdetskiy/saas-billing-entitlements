# Local primary hba — docs/runbooks/local-compose-profiles.md
# Password auth matches official postgres:16 image defaults (scram-sha-256).
# Replication rule allows pg_basebackup from Docker bridge networks only.

# TYPE  DATABASE        USER            ADDRESS                 METHOD
local   all             all                                     trust
host    all             all             127.0.0.1/32            trust
host    all             all             ::1/128                 trust
host    all             all             all                     scram-sha-256
host    replication     replicator      0.0.0.0/0               scram-sha-256
