; Optional RO bouncer — docs/runbooks/pgbouncer-pools.md
; In-compose DSN host: pgbouncer-replica:5432 (publish 6433)
[databases]
billing = host=postgres-replica port=5432 dbname=billing

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432
auth_type = plain
auth_file = /tmp/pgbouncer-userlist.txt
admin_users = billing
pool_mode = session
max_client_conn = 100
default_pool_size = 15
min_pool_size = 3
reserve_pool_size = 3
server_reset_query = DISCARD ALL
ignore_startup_parameters = extra_float_digits
