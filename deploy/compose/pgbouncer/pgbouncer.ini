; Local PgBouncer in front of primary — docs/runbooks/pgbouncer-pools.md
; Pool sizing aligns with spec.md §8.1: multiplex many app clients to fewer PG backends.
[databases]
billing = host=postgres port=5432 dbname=billing

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432
auth_type = plain
auth_file = /tmp/pgbouncer-userlist.txt
admin_users = billing
pool_mode = session
max_client_conn = 200
default_pool_size = 25
min_pool_size = 5
reserve_pool_size = 5
server_reset_query = DISCARD ALL
ignore_startup_parameters = extra_float_digits
