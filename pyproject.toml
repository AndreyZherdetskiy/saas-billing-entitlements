[project]
name = "billing-platform"
version = "0.1.0"
description = "Billing & Entitlements Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141,<0.142",
    "uvicorn[standard]>=0.32,<0.53",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "asyncpg>=0.31,<0.32",
    "alembic>=1.14,<2",
    "celery>=5.6,<5.7",
    "aiokafka>=0.14,<0.15",
    "structlog>=26,<27",
    "opentelemetry-api>=1.44,<1.45",
    "opentelemetry-sdk>=1.44,<1.45",
    "redis>=8.1,<9",
    "httpx>=0.28,<0.29",
    "opentelemetry-instrumentation-fastapi>=0.65b0,<0.66",
    "opentelemetry-exporter-otlp-proto-http>=1.44,<1.45",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<0.25",
    "pytest-cov>=6,<7",
    "testcontainers>=4,<5",
    "ruff>=0.8,<0.9",
    "mypy>=1.13,<1.14",
    "celery-types>=0.26.0",
    "pre-commit>=4,<5",
]
load = [
    "locust[otel]>=2.32,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/billing_platform"]

[tool.ruff]
line-length = 99
target-version = "py312"
src = ["src", "loadtests", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["billing_platform"]

[[tool.mypy.overrides]]
module = ["aiokafka", "aiokafka.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "opentelemetry.instrumentation.*",
    "opentelemetry.exporter.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib --strict-markers"
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: API + PG/Redis/Kafka via Testcontainers; Helm template; docker compose config",
    "live_compose: HTTP probes against a running make compose-core stack (CI load-locust-smoke)",
]
